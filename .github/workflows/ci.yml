name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_dev.txt
      - name: Download screening bundle
        run: |
          python - <<'PY'
          try:
              from apps.model_loader import get_bundle

              get_bundle()
          except Exception as exc:
              raise SystemExit(f"Unable to download the screening bundle: {exc}")
          PY
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q -m "not hf"

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:test
            ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Start container and wait for health
        run: |
          docker run -d --name resume-screening -e PORT=8000 -p 8000:8000 \
            "${{ steps.image.outputs.name }}:test"
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /tmp/health.json; then
              python -c "import json; d=json.load(open('/tmp/health.json')); assert d.get('model_loaded') is True"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for model_loaded=true" >&2
          exit 1
      - name: Smoke test made-up example
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with open("outputs/parity_fixture.json", encoding="utf-8") as handle:
              fixture = json.load(handle)
          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/screen",
              data=json.dumps({
                  "job_description": fixture["job_description"],
                  "resumes": fixture["resumes"],
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              body = json.load(response)
          assert "results" in body and body["results"]
          assert any("rank" in row for row in body["results"])
          print("Smoke test returned ranked results")
          PY
      - name: Summarize image and memory
        run: |
          docker images "${{ steps.image.outputs.name }}:test" --format \
            "Image size: {{.Size}}" >> "$GITHUB_STEP_SUMMARY"
          docker stats --no-stream resume-screening \
            --format "Container memory: {{.MemUsage}}" >> "$GITHUB_STEP_SUMMARY"
      - name: Free tier 512 MB test
        continue-on-error: true
        run: |
          set -e
          docker rm -f resume-screening-free >/dev/null 2>&1 || true
          docker run -d --name resume-screening-free --memory=512m --memory-swap=512m \
            -e PORT=8000 -p 8001:8000 "${{ steps.image.outputs.name }}:test"

          stage=startup
          ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/api/v1/health > /tmp/free-health.json; then
              if python -c "import json; d=json.load(open('/tmp/free-health.json')); assert d.get('model_loaded') is True"; then
                ready=true
                break
              fi
            fi
            sleep 5
          done

          if [ "$ready" != "true" ]; then
            inspect=$(docker inspect resume-screening-free)
            oom=$(python -c "import json,sys; d=json.loads(sys.argv[1]); print(d[0]['State'].get('OOMKilled',False))" "$inspect")
            exit_code=$(python -c "import json,sys; d=json.loads(sys.argv[1]); print(d[0]['State'].get('ExitCode','unknown'))" "$inspect")
            if [ "$oom" = "True" ]; then
              echo "512 MB free tier: was killed by OOM at startup (exit code $exit_code)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "512 MB free tier: startup timed out without an OOM kill (exit code $exit_code)" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          stage=screening
          python - <<'PY'
          import json
          import urllib.request

          with open("outputs/parity_fixture.json", encoding="utf-8") as handle:
              fixture = json.load(handle)
          request = urllib.request.Request(
              "http://127.0.0.1:8001/api/v1/screen",
              data=json.dumps({
                  "job_description": fixture["job_description"],
                  "resumes": fixture["resumes"],
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              body = json.load(response)
          assert "results" in body and body["results"]
          PY

          inspect=$(docker inspect resume-screening-free)
          oom=$(python -c "import json,sys; d=json.loads(sys.argv[1]); print(d[0]['State'].get('OOMKilled',False))" "$inspect")
          exit_code=$(python -c "import json,sys; d=json.loads(sys.argv[1]); print(d[0]['State'].get('ExitCode','unknown'))" "$inspect")
          if [ "$oom" = "True" ]; then
            echo "512 MB free tier: was killed by OOM during screening (exit code $exit_code)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "512 MB free tier: survived the 512 MB limit" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove free tier container
        if: always()
        run: docker rm -f resume-screening-free >/dev/null 2>&1 || true
      - name: Stop smoke container
        if: always()
        run: docker rm -f resume-screening >/dev/null 2>&1 || true
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Deploy was skipped because RENDER_DEPLOY_HOOK_URL was not set."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null
          if [ -z "$LIVE_URL" ]; then
            echo "Deploy timed out: LIVE_URL is not set" >&2
            exit 1
          fi
          for i in $(seq 1 60); do
            if curl --fail --silent "${LIVE_URL%/}/api/v1/health" > /tmp/live-health.json; then
              if python -c "import json; d=json.load(open('/tmp/live-health.json')); assert d.get('model_loaded') is True"; then
                echo "Live deployment is healthy"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Deploy timed out waiting for LIVE_URL model_loaded=true" >&2
          exit 1
